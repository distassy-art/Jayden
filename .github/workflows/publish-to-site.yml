# publish-to-site — the Jayden -> smartsolutionsai.us bridge (Grok Bot for Mina, 2026-09-28 PT).
#
# Any agent working on distassy-art/Jayden publishes site data by committing files under
#   site-publish/<path in ss-unified-proto>
# and pushing (any branch). This workflow copies ONLY the files that push changed into the same
# <path> in distassy-art/ss-unified-proto, runs that repo's own gates (scripts/check-app-data.mjs pre
# + npm test, plus the billing / La Mesa / manifest invariants its deploy workflows enforce), and
# pushes one commit to ss-unified-proto main:   bridge: <jayden sha> <jayden commit subject>
# ss-unified-proto's own deploy-main / deploy-api workflows then deploy it. Nothing here talks to
# Cloudflare, and nothing is ever force-pushed.
#
# The path policy and all checks live in .github/scripts/site-publish-bridge.sh and are ALWAYS
# loaded from Jayden main (never from the pushed branch), so a branch cannot loosen them.
# Allowed destinations (to start): public/data/**, api/cf-dist/data/**, public/inventory/**,
# public/reports/**, public/order-comparisons/**, public/orders.json, public/billing-live.json.
# Always refused: .github/, api/src/, /new, /new1, app.html / _locked-shell / marketing shell,
# worker / wrangler / package / manifest files, scripts, html/js/sh/py/toml/yml, dotfiles.
#
# Secret: SS_PROTO_PUSH_TOKEN = a fine-grained GitHub token limited to distassy-art/ss-unified-proto
# with Contents: Read and write (a token push, unlike GITHUB_TOKEN, starts ss-unified-proto's deploys).
name: publish-to-site
on:
  push:
    branches: ['**']
    paths: ['site-publish/**']
  workflow_dispatch:
    inputs:
      files:
        description: "Optional: space-separated paths under site-publish/ to (re)publish from this ref. Empty = the files changed by the ref's latest commit."
        required: false
        default: ""
permissions:
  contents: read
# No concurrency group on purpose: GitHub would CANCEL queued runs in the same group, silently
# dropping publishes. Parallel runs are safe: each one rebases onto the current main before pushing.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Jayden (full history, to see exactly what this push changed)
        uses: actions/checkout@v4
        with:
          path: jayden
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Jayden main (the bridge policy script is always taken from main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: jayden-main
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Load the bridge policy script from Jayden main (never from the pushed branch)
        run: |
          set -euo pipefail
          cp jayden-main/.github/scripts/site-publish-bridge.sh "$RUNNER_TEMP/site-publish-bridge.sh"
          echo "policy script $(sha256sum "$RUNNER_TEMP/site-publish-bridge.sh" | cut -c1-12) from Jayden main $(git -C jayden-main rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require secret SS_PROTO_PUSH_TOKEN
        env:
          SS_PROTO_PUSH_TOKEN: ${{ secrets.SS_PROTO_PUSH_TOKEN }}
        run: |
          [ -n "$SS_PROTO_PUSH_TOKEN" ] || {
            echo "::error::Jayden secret SS_PROTO_PUSH_TOKEN is not set. Settings -> Secrets and variables -> Actions -> New repository secret. Value: a fine-grained token limited to distassy-art/ss-unified-proto with Contents: Read and write."
            exit 1; }

      - name: Publish site-publish/ changes to ss-unified-proto main
        env:
          SS_PROTO_PUSH_TOKEN: ${{ secrets.SS_PROTO_PUSH_TOKEN }}
          JAYDEN_DIR: ${{ github.workspace }}/jayden
          PROTO_DIR: ${{ runner.temp }}/ss-unified-proto
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_FILES: ${{ inputs.files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$RUNNER_TEMP/site-publish-bridge.sh"
