#:schema node_modules/wrangler/config-schema.json
# Preview deployment for the admin console.
#
# This is a NEW, separate worker. It never touches `smartsolutions-site`, which
# keeps serving smartsolutionsai.us exactly as before.

name = "smartsolutions-admin-preview"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# SHA-256 of the preview access phrase. Only the hash lives here; the phrase
# itself is shared out of band. Remove this line to open the preview up, or
# override it with `wrangler secret put PREVIEW_ACCESS_SHA256`.
PREVIEW_ACCESS_SHA256 = "ba67702aadfdd4112766515c7b462430d90e57de539dbb0399106e6fe4ce6457"

# Where the console is served from. Empty means the root of whatever hostname
# points at this worker, which is right for a workers.dev URL.
MOUNT_PATH = ""

[assets]
directory = "./public"
binding = "ASSETS"
# Every request goes through the worker, which then falls back to env.ASSETS.
# Scoping this to /api/* would let static paths skip the worker altogether, and
# with them the preview access gate — the shell would load for anyone with the
# URL while only its data calls stayed locked.
run_worker_first = true

[observability]
enabled = true

# --------------------------------------------------------------------------
# smartsolutionsai.us/new
# --------------------------------------------------------------------------
# `npx wrangler deploy --env live` serves the console from the real domain.
#
# The two designs run side by side. This adds routes to the zone; it does not
# modify, redeploy or reconfigure `smartsolutions-site`, which keeps serving
# every other path on the domain exactly as it does today. Only requests at
# /new reach this worker.
#
# The pair of patterns is deliberate. A single "/new*" would also swallow
# /newsletter and anything else merely starting with those three letters, so
# the bare path and the subtree are matched separately instead. The worker
# redirects /new to /new/ so both land in the same place.
#
# `vars` and `assets` are not inherited by a named environment, so both are
# repeated below rather than picked up from above. The only deliberate
# difference is MOUNT_PATH.

[env.live]
name = "smartsolutions-admin"
workers_dev = false

[[env.live.routes]]
pattern = "smartsolutionsai.us/new"
zone_name = "smartsolutionsai.us"

[[env.live.routes]]
pattern = "smartsolutionsai.us/new/*"
zone_name = "smartsolutionsai.us"

[env.live.vars]
PREVIEW_ACCESS_SHA256 = "ba67702aadfdd4112766515c7b462430d90e57de539dbb0399106e6fe4ce6457"
MOUNT_PATH = "/new"

[env.live.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.live.observability]
enabled = true
